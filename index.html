
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Signal Lab</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1720;
    color: #fff;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.header {
    padding: 20px 0;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    color: #9ca3af;
    margin-top: 8px;
}

.add-btn {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 18px;
}

.stock-card {
    background: #182330;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 15px;
}

.stock-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.stock-name {
    font-size: 21px;
    font-weight: bold;
}

.code {
    color: #8b96a3;
    font-size: 13px;
    margin-top: 5px;
}

.price {
    font-size: 27px;
    font-weight: bold;
    margin-top: 14px;
}

.up {
    color: #35d07f;
}

.signal-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.signal {
    flex: 1;
    background: #111a24;
    border-radius: 12px;
    padding: 14px;
}

.signal-title {
    color: #9ca3af;
    font-size: 13px;
}

.signal-score {
    font-size: 28px;
    font-weight: bold;
    margin-top: 6px;
}

.buy { color: #35d07f; }
.sell { color: #ff6b6b; }

.delete-btn {
    float: right;
    background: transparent;
    border: 1px solid #4b5563;
    color: #9ca3af;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
}

.empty {
    text-align: center;
    color: #9ca3af;
    padding: 40px 10px;
    background: #182330;
    border-radius: 18px;
}

.footer {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    padding: 25px;
}

@media (max-width: 600px) {
    .container {
        padding: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📊 Stock Signal Lab</h1>
        <p>기술적 지표 기반 매수·매도 시그널 분석</p>
    </div>

    <button class="add-btn" onclick="addStock()">
        ＋ 관심종목 추가
    </button>

    <div id="stockList"></div>

    <div class="footer">
        Stock Signal Lab · Prototype v0.2
    </div>

</div>

<script>

const defaultStocks = [
    {
        name: "삼성전자",
        code: "005930",
        price: "72,500원",
        change: "▲ 1.82%",
        buy: 78,
        sell: 32
    },
    {
        name: "SK하이닉스",
        code: "000660",
        price: "185,000원",
        change: "▲ 2.41%",
        buy: 71,
        sell: 38
    }
];

let stocks = JSON.parse(localStorage.getItem("stockSignalStocks"));

if (!stocks) {
    stocks = defaultStocks;
    saveStocks();
}

function saveStocks() {
    localStorage.setItem(
        "stockSignalStocks",
        JSON.stringify(stocks)
    );
}

function renderStocks() {

    const list = document.getElementById("stockList");

    if (stocks.length === 0) {
        list.innerHTML = `
            <div class="empty">
                아직 등록된 관심종목이 없습니다.<br>
                위의 "관심종목 추가" 버튼을 눌러주세요.
            </div>
        `;
        return;
    }

    list.innerHTML = stocks.map((stock, index) => `

        <div class="stock-card">

            <button
                class="delete-btn"
                onclick="deleteStock(${index})">
                삭제
            </button>

            <div class="stock-top">

                <div>
                    <div class="stock-name">
                        ${stock.name}
                    </div>

                    <div class="code">
                        ${stock.code} · KOSPI
                    </div>
                </div>

                <div class="up">
                    ${stock.change || "데이터 준비중"}
                </div>

            </div>

            <div class="price">
                ${stock.price || "데이터 준비중"}
            </div>

            <div class="signal-row">

                <div class="signal">

                    <div class="signal-title">
                        매수 시그널
                    </div>

                    <div class="signal-score buy">
                        ${stock.buy ?? "-"}
                    </div>

                </div>

                <div class="signal">

                    <div class="signal-title">
                        매도 시그널
                    </div>

                    <div class="signal-score sell">
                        ${stock.sell ?? "-"}
                    </div>

                </div>

            </div>

        </div>

    `).join("");
}

function addStock() {

    const name = prompt("종목명을 입력하세요.");

    if (!name) {
        return;
    }

    const code = prompt(
        "종목코드 6자리를 입력하세요.\n예: 삼성전자 → 005930"
    );

    if (!code) {
        return;
    }

    if (!/^\d{6}$/.test(code)) {
        alert("종목코드는 숫자 6자리로 입력해주세요.");
        return;
    }

    const exists = stocks.some(
        stock => stock.code === code
    );

    if (exists) {
        alert("이미 등록된 종목입니다.");
        return;
    }

    stocks.push({
        name: name,
        code: code,
        price: "데이터 준비중",
        change: "데이터 준비중",
        buy: "-",
        sell: "-"
    });

    saveStocks();
    renderStocks();
}

function deleteStock(index) {

    const stock = stocks[index];

    const ok = confirm(
        `${stock.name}을(를) 관심종목에서 삭제할까요?`
    );

    if (!ok) {
        return;
    }

    stocks.splice(index, 1);

    saveStocks();
    renderStocks();
}

renderStocks();

</script>

</body>
</html>
